server {
    listen 80;
    server_name localhost nomorewaste.local;

    root /var/www/no-more-waste/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(login|register|forgot-password|reset-password|client|merchant|volunteer|staff|admin|api|ping|profile|distribution-rounds|deliveries|renew-subscription) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /custom_404.html;
    location = /custom_404.html {
        root /var/www/no-more-waste/errors;
        internal;
    }

    error_page 500 502 503 504 /custom_500.html;
    location = /custom_500.html {
        root /var/www/no-more-waste/errors;
        internal;
    }
}