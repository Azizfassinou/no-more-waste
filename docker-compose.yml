services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nomorewaste-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - DB_FILE=/app/data/no-more-waste.db
    volumes:
      - backend-data:/app/data
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nomorewaste-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-data: