<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Erreur Serveur | No More Waste</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 5rem; margin: 0; color: #ef4444; }
        h2 { font-size: 1.5rem; margin-top: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        a {
            display: inline-block;
            background: #2d6a4f;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover { background: #1b4332; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Erreur serveur interne</h2>
        <p>Un problème est survenu sur nos serveurs. Veuillez réessayer dans quelques instants.</p>
        <a href="/">Réessayer</a>
    </div>
</body>
</html>
